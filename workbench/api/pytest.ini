[pytest]
testpaths = tests
# Heavy checks are marked @pytest.mark.slow and skipped by default (docs/ml-engine-design.md §11);
# run them with `-m slow` (a later -m on the command line overrides this one).
addopts = -ra -m "not slow"
markers =
    slow: heavy checks, skipped by default; run with -m slow
filterwarnings =
    ignore::DeprecationWarning:botocore.*
